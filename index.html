<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>エラー判定マトリクス</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#242424;background:#f5f5f5;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI",Meiryo,sans-serif}button,input{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd;background:#fffffff2}.head,.wrap{max-width:1400px;margin:auto;padding:14px 18px}.head,.bar,.row,.cardhead{display:flex;align-items:center;gap:8px}.head{justify-content:space-between}.head h1{margin:0;font-size:19px}.head p{margin:1px 0 0;color:#666;font-size:12px}.row{flex-wrap:wrap}.btn{min-height:33px;padding:5px 10px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#222}.btn:hover{background:#eee}.primary{border-color:#0f6cbd;background:#0f6cbd;color:#fff}.danger{color:#b10e1e}.wrap{padding-top:16px}.bar{justify-content:space-between;padding:10px;border:1px solid #ddd;border-radius:9px;background:#fff}.tabs{display:flex;padding:2px;border:1px solid #ddd;border-radius:7px;background:#f2f2f2}.tabs button{min-height:28px;padding:3px 10px;border:0;border-radius:5px;background:transparent}.tabs .on{background:#fff;box-shadow:0 1px 3px #0002}.search{width:min(330px,42vw);height:33px;padding:5px 8px;border:1px solid #ccc;border-radius:6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:11px 0}.stat{padding:10px 13px;border:1px solid #e1e1e1;border-radius:8px;background:#fff}.stat span{display:block;color:#666;font-size:11px}.stat b{font-size:22px}.list{display:grid;gap:10px}.card{overflow:hidden;border:1px solid #ddd;border-radius:9px;background:#fff}.cardhead{justify-content:space-between;padding:10px 12px;border-bottom:1px solid #eee;background:#fafafa}.name,.txt{height:30px;padding:4px 7px;border:1px solid transparent;border-radius:5px;background:transparent}.name{width:min(430px,65vw);font-weight:700}.name:hover,.name:focus,.txt:hover,.txt:focus{border-color:#ccc;background:#fff;outline:0}.meta{color:#666;font-size:11px}.scroll{overflow:auto}table{border-collapse:collapse}.edit{width:100%;min-width:780px;table-layout:fixed}.edit th,.edit td{padding:8px;border-bottom:1px solid #eee;text-align:left}.edit th{color:#666;font-size:11px}.edit th:first-child{width:27%}.edit th:nth-child(2),.edit th:nth-child(3){width:105px}.edit th:nth-child(4){width:120px}.edit th:last-child{width:45px}.edit tr.ex{background:#fff8e1}.txt{width:100%}.check{display:flex;align-items:center;gap:5px}.check input{width:17px;height:17px;accent-color:#0f6cbd}.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}.ok{color:#107c10;background:#eff9ef}.warn{color:#805b00;background:#fff4c2}.ng{color:#b10e1e;background:#fff0f1}.foot{padding:8px 11px;background:#fafafa}.empty{padding:38px 18px;border:1px dashed #ccc;border-radius:9px;background:#fff;text-align:center;color:#666}.matrixbox{max-height:calc(100vh - 270px);overflow:auto;border:1px solid #ddd;border-radius:9px;background:#fff}.matrix{width:max-content;min-width:100%}.matrix th,.matrix td{min-width:145px;padding:8px;border-right:1px solid #eee;border-bottom:1px solid #eee;vertical-align:top;text-align:left}.matrix thead th{position:sticky;top:0;z-index:2;background:#fafafa}.matrix .first{position:sticky;left:0;z-index:1;min-width:190px;background:#fafafa}.matrix thead .first{z-index:3}.cell{padding:6px;border:1px solid #eee;border-radius:6px;background:#fafafa}.cell.ex{border-color:#e4bf5f;background:#fff8e1}.cell+.cell{margin-top:5px}.flags{margin-top:4px;color:#666;font-size:10px}.flags div{display:flex;justify-content:space-between}.off{color:#b10e1e}.toast{position:fixed;right:14px;bottom:14px;padding:8px 11px;border-radius:6px;background:#323130;color:#fff;opacity:0;pointer-events:none}.toast.on{opacity:1}[hidden]{display:none!important}
@media(max-width:760px){.head{align-items:flex-start}.head p{display:none}.bar{align-items:stretch;flex-direction:column}.bar>.row:last-child{justify-content:space-between}.search{flex:1;width:100%}.stats{grid-template-columns:repeat(2,1fr)}.cardhead{align-items:flex-start;flex-direction:column}.matrixbox{max-height:calc(100vh - 330px)}}
</style>
</head>
<body>
<header class="top"><div class="head"><div><h1>エラー判定マトリクス</h1><p>画面 × 判定タイミングごとに、表示・通知の例外を管理</p></div><div class="row"><button class="btn" id="load">JSON読込</button><button class="btn" id="save-json">JSON出力</button><button class="btn" id="save-csv">CSV出力</button><button class="btn danger" id="reset">初期化</button></div></div></header>
<main class="wrap"><section class="bar"><div class="row"><button class="btn primary" id="add-screen">＋ 画面を追加</button><div class="tabs"><button id="edit-tab" class="on">編集</button><button id="matrix-tab">クロス表</button></div></div><div class="row"><input class="search" id="search" type="search" placeholder="画面名・タイミングを検索"><label><input id="only" type="checkbox"> 例外のみ</label></div></section><section class="stats"><div class="stat"><span>画面数</span><b id="sc">0</b></div><div class="stat"><span>判定タイミング数</span><b id="tc">0</b></div><div class="stat"><span>例外数</span><b id="ec">0</b></div><div class="stat"><span>表示・通知なし</span><b id="nc">0</b></div></section><section id="editor" class="list"></section><section id="matrix-view" hidden><div id="matrix" class="matrixbox"></div></section></main>
<input id="file" type="file" accept="application/json,.json" hidden><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),KEY='test-matrix/v1';
const id=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2),timing=(name='判定タイミング 1')=>({id:id('t'),name,display:true,notify:true,note:''}),screen=(name='画面 1')=>({id:id('s'),name,timings:[timing()]});
const fresh=()=>({screens:[screen()]}),safeGet=()=>{try{return localStorage.getItem(KEY)}catch{return null}},save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}};
const clean=x=>{if(!x||!Array.isArray(x.screens))throw Error('対応していないJSON形式です。');return{screens:x.screens.map((s,i)=>({id:s.id||id('s'),name:typeof s.name==='string'?s.name:`画面 ${i+1}`,timings:Array.isArray(s.timings)?s.timings.map((t,j)=>({id:t.id||id('t'),name:typeof t.name==='string'?t.name:`判定タイミング ${j+1}`,display:t.display!==false&&t.errorDisplay!==false,notify:t.notify!==false&&t.notification!==false,note:typeof t.note==='string'?t.note:''})):[]}))}};
let data;try{data=safeGet()?clean(JSON.parse(safeGet())):fresh()}catch{data=fresh()}let view='edit',query='',only=false,timer;
const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'),norm=x=>String(x??'').trim().toLowerCase(),ex=t=>!t.display||!t.notify;
const state=t=>t.display&&t.notify?['ok','標準']:t.display?['warn','表示のみ']:t.notify?['warn','通知のみ']:['ng','表示・通知なし'];
const badge=t=>{const s=state(t);return `<span class="badge ${s[0]}">${s[1]}</span>`},getS=sid=>data.screens.find(s=>s.id===sid),getT=(sid,tid)=>getS(sid)?.timings.find(t=>t.id===tid);
const toast=x=>{const e=$('#toast');e.textContent=x;e.classList.add('on');clearTimeout(timer);timer=setTimeout(()=>e.classList.remove('on'),2000)};
const rows=s=>{const q=norm(query),sm=!q||norm(s.name).includes(q);return s.timings.filter(t=>(!only||ex(t))&&(!q||sm||norm(t.name).includes(q)||norm(t.note).includes(q)))};
const screens=()=>data.screens.filter(s=>rows(s).length||(!only&&!s.timings.length&&(!query||norm(s.name).includes(norm(query)))));
const check=(s,t,k)=>`<label class="check"><input type="checkbox" data-a="toggle" data-s="${s.id}" data-t="${t.id}" data-k="${k}" ${t[k]?'checked':''}><span>${t[k]?'あり':'なし'}</span></label>`;
function stats(){const a=data.screens.flatMap(s=>s.timings);$('#sc').textContent=data.screens.length;$('#tc').textContent=a.length;$('#ec').textContent=a.filter(ex).length;$('#nc').textContent=a.filter(t=>!t.display&&!t.notify).length}
function editor(){const a=screens(),e=$('#editor');if(!a.length){e.innerHTML='<div class="empty">表示できる項目がありません。</div>';return}e.innerHTML=a.map(s=>{const r=rows(s).map(t=>`<tr class="${ex(t)?'ex':''}"><td><input class="txt" data-f="timing" data-s="${s.id}" data-t="${t.id}" value="${esc(t.name)}" placeholder="入力時 / 確定時"></td><td>${check(s,t,'display')}</td><td>${check(s,t,'notify')}</td><td>${badge(t)}</td><td><input class="txt" data-f="note" data-s="${s.id}" data-t="${t.id}" value="${esc(t.note)}" placeholder="例外理由・補足"></td><td><button class="btn danger" data-a="del-t" data-s="${s.id}" data-t="${t.id}">×</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">判定タイミングがありません。</td></tr>';return `<article class="card"><div class="cardhead"><div><input class="name" data-f="screen" data-s="${s.id}" value="${esc(s.name)}" placeholder="画面名"><span class="meta">${s.timings.length} タイミング ・ ${s.timings.filter(ex).length} 例外</span></div><button class="btn danger" data-a="del-s" data-s="${s.id}">画面削除</button></div><div class="scroll"><table class="edit"><thead><tr><th>エラー判定タイミング</th><th>エラー表示</th><th>通知</th><th>区分</th><th>メモ</th><th></th></tr></thead><tbody>${r}</tbody></table></div><div class="foot"><button class="btn" data-a="add-t" data-s="${s.id}">＋ 判定タイミングを追加</button></div></article>`}).join('')}
function matrix(){const ss=screens(),cs=[],keys=new Set;ss.forEach(s=>rows(s).forEach(t=>{const label=t.name.trim()||'未設定',key=norm(label);if(!keys.has(key)){keys.add(key);cs.push({key,label})}}));const e=$('#matrix');if(!ss.length||!cs.length){e.innerHTML='<div class="empty">表示できるマトリクスがありません。</div>';return}e.innerHTML=`<table class="matrix"><thead><tr><th class="first">画面</th>${cs.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${ss.map(s=>`<tr><th class="first">${esc(s.name||'未設定')}</th>${cs.map(c=>{const a=rows(s).filter(t=>norm(t.name.trim()||'未設定')===c.key);return a.length?`<td>${a.map(t=>`<div class="cell ${ex(t)?'ex':''}">${badge(t)}<div class="flags"><div><span>エラー表示</span><b class="${t.display?'':'off'}">${t.display?'あり':'なし'}</b></div><div><span>通知</span><b class="${t.notify?'':'off'}">${t.notify?'あり':'なし'}</b></div></div></div>`).join('')}</td>`:'<td>—</td>'}).join('')}</tr>`).join('')}</tbody></table>`}
function show(){const edit=view==='edit';$('#editor').hidden=!edit;$('#matrix-view').hidden=edit;$('#edit-tab').classList.toggle('on',edit);$('#matrix-tab').classList.toggle('on',!edit)}function render(){stats();editor();matrix();show()}
function addScreen(){let n=data.screens.length+1;const s=screen(`画面 ${n}`);data.screens.push(s);only=false;$('#only').checked=false;save();render()}
function addTiming(sid){const s=getS(sid);if(!s)return;s.timings.push(timing(`判定タイミング ${s.timings.length+1}`));only=false;$('#only').checked=false;save();render()}
$('#editor').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,s=b.dataset.s,t=b.dataset.t;if(a==='add-t')addTiming(s);if(a==='del-s'){const x=getS(s);if(x&&confirm(`「${x.name}」を削除しますか？`)){data.screens=data.screens.filter(v=>v.id!==s);save();render()}}if(a==='del-t'){const x=getS(s),y=getT(s,t);if(x&&y&&confirm(`「${y.name}」を削除しますか？`)){x.timings=x.timings.filter(v=>v.id!==t);save();render()}}};
$('#editor').oninput=e=>{const x=e.target,f=x.dataset.f,s=getS(x.dataset.s),t=getT(x.dataset.s,x.dataset.t);if(f==='screen'&&s)s.name=x.value;if(f==='timing'&&t)t.name=x.value;if(f==='note'&&t)t.note=x.value;save()};
$('#editor').onchange=e=>{const x=e.target;if(x.dataset.a==='toggle'){const t=getT(x.dataset.s,x.dataset.t);if(t){t[x.dataset.k]=x.checked;save();render()}}else if(x.dataset.f)render()};
$('#add-screen').onclick=addScreen;$('#edit-tab').onclick=()=>{view='edit';show()};$('#matrix-tab').onclick=()=>{view='matrix';matrix();show()};$('#search').oninput=e=>{query=e.target.value;editor();matrix()};$('#only').onchange=e=>{only=e.target.checked;editor();matrix()};
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),0)}const stamp=()=>new Date().toISOString().slice(0,10).replaceAll('-','');
$('#save-json').onclick=()=>{download(`error-test-matrix-${stamp()}.json`,JSON.stringify({version:1,screens:data.screens},null,2),'application/json');toast('JSONを書き出しました。')};
$('#save-csv').onclick=()=>{const a=[['画面','判定タイミング','エラー表示','通知','区分','メモ']];data.screens.forEach(s=>s.timings.forEach(t=>a.push([s.name,t.name,t.display?'あり':'なし',t.notify?'あり':'なし',state(t)[1],t.note])));const q=x=>''+String(x??'').replaceAll('"','""')+'';download(`error-test-matrix-${stamp()}.csv`,'\ufeff'+a.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv');toast('CSVを書き出しました。')};
$('#load').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=clean(JSON.parse(await f.text()));if(confirm('現在の内容を読み込んだJSONで置き換えますか？')){data=d;save();render();toast('JSONを読み込みました。')}}catch(x){toast(x.message)}e.target.value=''};
$('#reset').onclick=()=>{if(confirm('すべて初期化しますか？')){data=fresh();save();render()}};render();
})();
</script>
</body>
</html>
